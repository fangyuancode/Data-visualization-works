#?????
server:
#  address:  192.168.0.136
  port: 9091

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/visualization_project?useUnicode=true&characterEncoding=utf8&allowMultiQueries=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB


mybatis:

  mapper-locations: classpath:mapper/*.xml
  #    type-aliases-package: com.gouggou.shardingtable.entity
  configuration:
    # 使用 Slf4jImpl，避免 SQL 直接刷屏到控制台，日志级别由 logging.level 控制。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true

# 轻量级日志配置：不使用数据库日志表，只输出到控制台和 logs/base-project.log 文件。
logging:
  level:
    root: info
    org.example.base_project: info
    org.springframework.web: warn
    org.mybatis: warn
    org.apache.ibatis: warn
  file:
    name: logs/base-project.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 30
      total-size-cap: 1GB
